solver: ndef
mode: multiview
runtime:
  random_seed: 20260805
  deterministic: true
case:
  root: case/Multi/CylinderDIC
  images: images
  # Cameras and sparse points are transformed together into the metric world
  # frame; never mix meta-camera extrinsics with untransformed SfM points.
  calibration: result/calibration/calibration_result_scaled.json
  # NDeF consumes an explicitly initialized world-frame surface.  The cylinder
  # case uses this known surface for validation; production callers provide an
  # independently reconstructed/reference surface at the same interface.
  reference_surface: ground_truth/theoretical_surface_points.npy
  # Generated by `neurodic.generate_ndef_roi()` from pair-shared calibration
  # observations. Files are named `<camera>_mask.npy`.
  masks: result/mask/per_camera
  frame: -1
surface:
  max_points: 100000
  # Post-training visibility/depth-consistency fusion of the C++ dense charts.
  fusion_relative_sample_spacing: 0.006
  fusion_depth_tolerance_factor: 1.0
  fusion_min_visible_cameras: 2
  fusion_max_points: 100000
scale:
  # The migrated chessboard-scale product is preferred. Set sfm_to_world_scale
  # explicitly only when the scale result is unavailable.
  calibration_scale: result/calibration/calibration_scale.json
interpolation:
  type: bspline
  degree: 3
surface_model:
  hidden_dim: 32
  pixel_layers: 3
  camera_layers: 2
  trunk_layers: 3
  camera_embedding_dim: 16
  # Match the reference NDeF-DIC dense configuration: Fourier-encode
  # normalized pixel coordinates before the pixel MLP.
  positional_encoding_enabled: true
  positional_encoding_num_frequencies: 4
surface_training:
  device: cuda
  pretrain_iterations: 3000
  pretrain_learning_rate: 0.001
  weight_decay: 0.000001
  smoothness_weight: 0.0001
  smooth_samples_per_camera: 256
surface_dense_training:
  # C++ continuation of the same depth model after sparse SfM pretraining.
  iterations: 3000
  samples_per_camera: 10000
  spacing_px: 4
  patch_radius: 2
  learning_rate: 0.0001
  anchor_weight: 0.0
  min_valid_patch_ratio: 0.5
  seed: 20260806
deformation_model:
  # NDeFSolver owns the reference-surface 3 -> 32x5 -> 3 Tanh MLP.
  fourier_encoding:
    enabled: false
    num_frequencies: 6
    include_input: true
    angular_scale: 3.141592653589793
  output_scale: 1.0
precalculation:
  # Run `ndef_sparse_precalculation()` to create these C++ NCC + DLT tracks.
  sparse:
    points_per_camera: 300
    neighbors_per_camera: 2
    patch_radius: 10
    cross_search_radius: 40
    temporal_search_radius: 8
    cross_ncc_threshold: 0.45
    temporal_ncc_threshold: 0.55
    min_texture_std: 0.02
    max_reprojection_error: 3.0
    displacement_mad_threshold: 5.0
  # Optional NDeF-DIC sparse patch-DIC product. When supplied, C++ applies the
  # original magnitude-MAD filter and uses the selected inlier statistic as
  # the deformation output scale.
  # displacement: result/deformation/precalculation/patch_dic_sparse/sparse_displacement.npz
  key: displacement
  statistic: mean
  mad_threshold: 5.0
deformation_training:
  device: cuda
  photometric_iterations: 250
  photometric_sample_count: 2048
  photometric_learning_rate: 0.0005
  photometric_loss: znssd
  # Original NDeF-DIC deformation-stage semantics: camera-local patches,
  # visible-count weighting, invalid-patch penalty, AdamW, and optional
  # normalized-coordinate Jacobian regularization.
  patch_radius: 2
  min_valid_patch_ratio: 1.0
  invalid_patch_penalty: 0.05
  smoothness_weight: 0.0
  weight_decay: 0.0
output:
  result: result
  visualization: visualization
notes:
  - Surface/depth and deformation networks have separate model/training blocks.
  - Deformation topology is controlled by C++ NDeFSolver.
  - Valid observations require positive depth, image bounds, and both temporal ROI masks.
