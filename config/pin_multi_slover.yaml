# Reserved configuration for the independent pairwise multi-camera PIN route.
# Not consumed by existing PIN stereo or NDeF entry points.
solver: pin_multi_slover
mode: pairwise_multiview
runtime:
  random_seed: 20260807
  deterministic: true
case:
  root: case/Multi/CylinderDIC
  images: images
  # `run_multiview_case` writes the current staged self-calibration result here.
  # Its cameras are already transformed into the metric chessboard frame, so
  # reconstruction.world_scale remains 1.0 and must not reapply the SfM scale.
  calibration: result/calibration_final/calibration_result_scaled.json
  reference_frame: 001.bmp
  frame: -1
camera_pairs:
  selection: auto_spatial_neighbors
  wrap: true
  manual: []
pair_roi:
  generator: reference_pair_sift
  output: result/pin_multi_slover/pair_roi
  feature_method: sift
  max_features: 12000
  match_ratio: 0.75
  mutual_check: true
  ransac_reprojection_threshold_px: 3.0
  min_matches: 20
  support: convex_hull
  alpha_radius_scale: 8.0
  erode_pixels: 0
# Every A0->B0, A0->Ak, and A0->Bk planar field uses this configuration.
# Do not duplicate model, initialization, or training options in this file.
pin_2d_config: config/pin_2d.yaml
reconstruction:
  min_views: 2
  max_reprojection_error_px: 5.0
  require_positive_depth: true
  world_scale: 1.0
fusion:
  enabled: false  # Pairwise surfaces must be validated before enabling.
  voxel_size: 1.0
  max_reprojection_error_px: 5.0
  displacement_mad_factor: 5.0
  # Remove spatially isolated points from the fused reference surface.  The
  # same mask is applied to current surface and displacement visualization.
  surface_outlier_k_neighbors: 16
  surface_outlier_mad_factor: 5.0
  remove_rigid_body_motion: false
output:
  result: result/pin_multi_slover
  visualization: visualization/pin_multi_slover
notes:
  - This route owns pair-local SIFT ROI masks created from reference-time images.
  - Do not use case.result/mask/per_camera; that location belongs to NDeF ROI generation.
  - The pairwise planar solver configuration is loaded from pin_2d_config.
